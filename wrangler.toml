# Cloudflare Pages dağıtım yapılandırması
#
# BU DOSYA Pages (statik barındırma) yapılandırmasıdır. Workers yapılandırması
# DEĞİLDİR ve burada `main` (Worker giriş dosyası) tanımlanmaz — bu projede
# Worker kodu yoktur, yalnızca statik dosyalar dağıtılır.
#
# ÇOK ÖNEMLİ: Pages dağıtım komutu `wrangler deploy` DEĞİLDİR.
#   `wrangler deploy`          -> Worker giriş dosyası arar, "Missing
#                                  entry-point" hatası verir. Pages'ta çalışmaz.
#   `wrangler pages deploy`    -> doğru komut (statik varlıkları yükler).
#
# Cloudflare dashboard ayarları:
#   Build command      : npm run build
#   Deploy command     : npx wrangler pages deploy dist
#   Output directory   : dist
#   Node.js version    : 22
#
# Not: `pages_build_output_dir` yalnız `wrangler pages deploy`'in varsayılan
# çıktı dizinidir; dashboard'daki "Output directory" alanıyla birlikte çalışır.
# Dağıtım komutunda dizin açıkça geçtiği için iki yolun tutarlı olması şart.

name = "kelime-rotasi"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-02"
